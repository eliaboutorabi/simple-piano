<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Piano</title>
    <meta
      name="description"
      content="A compact Web Audio piano with touch, keyboard controls, sound presets, delay, reverb, sustain, and dark mode."
    />
    <link rel="canonical" href="https://eliaboutorabi.github.io/simple-piano/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Simple Piano" />
    <meta
      property="og:description"
      content="Play a polished browser piano with sound presets, delay, reverb, sustain, and dark mode."
    />
    <meta property="og:url" content="https://eliaboutorabi.github.io/simple-piano/" />
    <meta
      property="og:image"
      content="https://eliaboutorabi.github.io/simple-piano/assets/simple-piano-preview.png"
    />
    <meta property="og:image:width" content="2048" />
    <meta property="og:image:height" content="1322" />
    <meta property="og:image:alt" content="Simple Piano web app in dark mode" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Simple Piano" />
    <meta
      name="twitter:description"
      content="Play a polished browser piano with sound presets, delay, reverb, sustain, and dark mode."
    />
    <meta
      name="twitter:image"
      content="https://eliaboutorabi.github.io/simple-piano/assets/simple-piano-preview.png"
    />
    <script>
      const savedTheme = localStorage.getItem("simple-piano-theme");
      const preferredTheme = window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light";
      document.documentElement.dataset.theme = savedTheme || preferredTheme;
    </script>
    <link rel="stylesheet" href="styles.css?v=12" />
  </head>
  <body>
    <main class="app" aria-label="Simple piano web app">
      <section class="panel" aria-labelledby="app-title">
        <div class="title-row">
          <div>
            <p class="eyebrow">Web Audio Piano</p>
            <h1 id="app-title">Simple Piano</h1>
            <p class="subtitle">A compact instrument for quick melodies and soft experiments.</p>
          </div>
          <div class="actions">
            <button
              id="theme-toggle"
              class="icon-link theme-toggle"
              type="button"
              aria-label="Switch to dark mode"
              title="Toggle theme"
            >
              <svg class="sun-icon" aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                <path
                  d="M12 18.5A6.5 6.5 0 1 1 12 5.5a6.5 6.5 0 0 1 0 13Zm0-2A4.5 4.5 0 1 0 12 7.5a4.5 4.5 0 0 0 0 9ZM13 1v3h-2V1h2Zm0 19v3h-2v-3h2ZM4.22 2.81l2.12 2.12-1.41 1.41-2.12-2.12 1.41-1.41Zm14.85 14.85 2.12 2.12-1.41 1.41-2.12-2.12 1.41-1.41ZM1 11h3v2H1v-2Zm19 0h3v2h-3v-2ZM2.81 19.78l2.12-2.12 1.41 1.41-2.12 2.12-1.41-1.41ZM17.66 4.93l2.12-2.12 1.41 1.41-2.12 2.12-1.41-1.41Z"
                />
              </svg>
              <svg class="moon-icon" aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                <path
                  d="M21 14.48A8.4 8.4 0 0 1 9.52 3 9.4 9.4 0 1 0 21 14.48ZM11.34 5.14a10.43 10.43 0 0 0 7.52 7.52 7.4 7.4 0 1 1-7.52-7.52Z"
                />
              </svg>
            </button>
            <a
              class="icon-link"
              href="https://github.com/eliaboutorabi/simple-piano"
              target="_blank"
              rel="noreferrer"
              aria-label="View Simple Piano on GitHub"
              title="View on GitHub"
            >
              <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                <path
                  d="M12 2C6.48 2 2 6.58 2 12.26c0 4.53 2.87 8.38 6.84 9.74.5.09.68-.22.68-.49 0-.24-.01-1.05-.01-1.9-2.78.62-3.37-1.22-3.37-1.22-.45-1.18-1.11-1.5-1.11-1.5-.91-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.9 1.57 2.36 1.12 2.93.86.09-.67.35-1.12.63-1.38-2.22-.26-4.55-1.14-4.55-5.07 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.28 2.75 1.05A9.31 9.31 0 0 1 12 6.98c.85 0 1.7.12 2.5.34 1.9-1.33 2.74-1.05 2.74-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.94-2.34 4.81-4.57 5.07.36.32.68.94.68 1.9 0 1.38-.01 2.49-.01 2.82 0 .27.18.59.69.49A10.14 10.14 0 0 0 22 12.26C22 6.58 17.52 2 12 2Z"
                />
              </svg>
            </a>
            <button id="sustain" class="toggle" type="button" aria-pressed="false">
              Sustain
            </button>
          </div>
        </div>

        <div class="visualizer" aria-label="Audio waveform visualizer">
          <canvas id="waveform" width="960" height="160"></canvas>
        </div>

        <div class="controls" aria-label="Piano controls">
          <label>
            Volume
            <input id="volume" type="range" min="0" max="1" step="0.01" value="0.55" />
          </label>
          <label>
            Sound
            <select id="sound">
              <option value="classic" selected>Classic Piano</option>
              <option value="warm-pad">Warm Pad</option>
              <option value="bright-bell">Bright Bell</option>
              <option value="retro-synth">Retro Synth</option>
              <option value="soft-organ">Soft Organ</option>
            </select>
          </label>
          <label>
            Delay
            <input id="delay" type="range" min="0" max="0.8" step="0.01" value="0.12" />
          </label>
          <label>
            Reverb
            <input id="reverb" type="range" min="0" max="0.8" step="0.01" value="0.18" />
          </label>
          <label class="octave-control">
            <span class="control-heading">
              Octave
              <output id="octave-value" for="octave">Base</output>
            </span>
            <input id="octave" type="range" min="-2" max="2" step="1" value="0" />
          </label>
        </div>
        <p class="rotate-hint">Rotate your phone for the full keyboard.</p>

        <div class="keyboard" role="group" aria-label="Piano keyboard">
          <div class="key-bed">
            <div class="white-keys" aria-hidden="false"></div>
            <div class="black-keys" aria-hidden="false"></div>
          </div>
        </div>
        <footer class="credit">Built by Elham Aboutorabi</footer>
      </section>
    </main>
    <script src="app.js?v=16"></script>
  </body>
</html>
