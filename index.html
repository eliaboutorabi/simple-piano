<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Piano</title>
    <link rel="stylesheet" href="styles.css?v=5" />
  </head>
  <body>
    <main class="app" aria-label="Simple piano web app">
      <section class="panel" aria-labelledby="app-title">
        <div class="title-row">
          <div>
            <p class="eyebrow">Web Audio Piano</p>
            <h1 id="app-title">Simple Piano</h1>
          </div>
          <div class="actions">
            <a
              class="icon-link"
              href="https://github.com/eliaboutorabi/simple-piano"
              target="_blank"
              rel="noreferrer"
              aria-label="View Simple Piano on GitHub"
              title="View on GitHub"
            >
              <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                <path
                  d="M12 2C6.48 2 2 6.58 2 12.26c0 4.53 2.87 8.38 6.84 9.74.5.09.68-.22.68-.49 0-.24-.01-1.05-.01-1.9-2.78.62-3.37-1.22-3.37-1.22-.45-1.18-1.11-1.5-1.11-1.5-.91-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.9 1.57 2.36 1.12 2.93.86.09-.67.35-1.12.63-1.38-2.22-.26-4.55-1.14-4.55-5.07 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.28 2.75 1.05A9.31 9.31 0 0 1 12 6.98c.85 0 1.7.12 2.5.34 1.9-1.33 2.74-1.05 2.74-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.94-2.34 4.81-4.57 5.07.36.32.68.94.68 1.9 0 1.38-.01 2.49-.01 2.82 0 .27.18.59.69.49A10.14 10.14 0 0 0 22 12.26C22 6.58 17.52 2 12 2Z"
                />
              </svg>
            </a>
            <button id="sustain" class="toggle" type="button" aria-pressed="false">
              Sustain
            </button>
          </div>
        </div>

        <div class="controls" aria-label="Piano controls">
          <label>
            Volume
            <input id="volume" type="range" min="0" max="1" step="0.01" value="0.55" />
          </label>
          <label>
            Wave
            <select id="waveform">
              <option value="sine">Sine</option>
              <option value="triangle" selected>Triangle</option>
              <option value="square">Square</option>
              <option value="sawtooth">Sawtooth</option>
            </select>
          </label>
        </div>
        <p class="rotate-hint">Rotate your phone for the full keyboard.</p>

        <div class="keyboard" role="group" aria-label="Piano keyboard">
          <div class="key-bed">
            <div class="white-keys" aria-hidden="false"></div>
            <div class="black-keys" aria-hidden="false"></div>
          </div>
        </div>
        <footer class="credit">Built by Elham Aboutorabi</footer>
      </section>
    </main>
    <script src="app.js?v=5"></script>
  </body>
</html>
